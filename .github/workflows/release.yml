name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/test.yml
  instrumented-tests:
    uses: ./.github/workflows/instrumented-tests.yml

  release:
    needs: [test, instrumented-tests]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project

    steps:
      - uses: actions/checkout@v6

      - name: Verify versionName matches tag
        run: |
          VERSION_NAME=$(grep 'versionName = ' app/build.gradle.kts | sed -E 's/.*"(.+)".*/\1/')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION_NAME" != "$TAG_VERSION" ]; then
            echo "::error::versionName ($VERSION_NAME) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/gymtracker-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: project/app/build/outputs/apk/release/gymtracker-${{ github.ref_name }}.apk
          generate_release_notes: true
